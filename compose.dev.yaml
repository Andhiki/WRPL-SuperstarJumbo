services:
    wrpl-web:
        container_name: wrpl-web
        build:
            context: .
            dockerfile: Dockerfile.dev 

        # Set environment variables based on the .env file
        env_file:
            - .env

        environment:
            - WATCHPACK_POLLING=true
            # - CHOKIDAR_USEPOLLING=true
            - NODE_ENV=development
            - HOST=0.0.0.0
            - PORT=3000

        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next

        restart: always

        ports:
            - "3000:3000"
        networks:
            - wrpl-network

networks:
    wrpl-network:
        driver: bridge

volumes:
    wrpl-data: